<!DOCTYPE html><html><head>
    <meta charset="utf-8">
    <title>MemberServ - Credit Union Back Office</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fff; }
        table { border-collapse: collapse; margin: 20px 0; }
        td, th { border: 1px solid #ccc; padding: 8px; }
        .banner { background: #003366; color: #fff; padding: 10px; }
    </style>
</head>
<body>
    <div class="banner">MemberServ Back Office</div>
    
        
    
    
<form method="post" action="/login" id="loginForm">
<table>
    <tbody><tr>
        <td colspan="2"><h2>Staff Login</h2></td>
    </tr>
    <tr>
        <td>Username</td>
        <td><input type="text" name="username" id="username" aria-label="Username" style=""></td>
    </tr>
    <tr>
        <td>Password</td>
        <td><input type="password" name="password" id="password" aria-label="Password" style=""></td>
    </tr>
    <tr>
        <td colspan="2"><input type="submit" value="Login" name="login" aria-label="Login" style=""></td>
    </tr>
</tbody></table>
</form>


</body></html>
