<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MemberServ - Credit Union Back Office</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fff; }
        table { border-collapse: collapse; margin: 20px 0; }
        td, th { border: 1px solid #ccc; padding: 8px; }
        .banner { background: #003366; color: #fff; padding: 10px; }
    </style>
</head>
<body>
    <div class="banner" style="background: #006600;">AccountServ Back Office</div>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="color:red">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
</body>
</html>
